listener 8883
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/locker.acl
retain_available false
max_qos 0
max_packet_size 4096
persistence false
log_dest stdout
