server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_certificate /etc/letsencrypt/live/unistow.app/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/unistow.app/privkey.pem;

server {
    listen 80;
    server_name unistow.app www.unistow.app;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://unistow.app$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.unistow.app;
    return 308 https://unistow.app$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name unistow.app;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend app:8000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host unistow.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
    }
}
