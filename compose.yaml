name: unistow

services:
  mosquitto:
    image: eclipse-mosquitto:2
    profiles: [ mqtt ]
    ports:
      - "127.0.0.1:${MQTT_PORT:-8883}:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/locker.acl:/mosquitto/config/locker.acl:ro
      - ${MQTT_SECRETS_DIR:-./.local-mqtt}:/mosquitto/secrets:ro

  db:
    image: postgres:16
    entrypoint:
      - /bin/sh
      - -ec
      - |
        install -m 644 /run/local-cert/server.crt /run/postgres-tls/server.crt
        install -m 600 -o postgres /run/local-cert/server.key /run/postgres-tls/server.key
        exec docker-entrypoint.sh "$$@"
      - --
    command: [ "postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/postgres-tls/server.crt",
               "-c", "ssl_key_file=/run/postgres-tls/server.key", "-c", "hba_file=/etc/postgresql/local-hba.conf" ]
    tmpfs:
      - /run/postgres-tls
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unistow}
      POSTGRES_USER: ${POSTGRES_USER:-unistow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./.local-postgres/server.crt:/run/local-cert/server.crt:ro
      - ./.local-postgres/server.key:/run/local-cert/server.key:ro
      - ./deploy/local-postgres/pg_hba.conf:/etc/postgresql/local-hba.conf:ro
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
