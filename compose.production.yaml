name: unistow

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: unistow
      POSTGRES_USER: unistow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/migrations/001_add_lockers.sql:/docker-entrypoint-initdb.d/02-lockers.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U unistow -d unistow" ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [ database ]

  app:
    build: .
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: unistow
      POSTGRES_USER: unistow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_BASE_URL: https://unistow.app
      UNISTOW_PUBNUB_OPEN: ${UNISTOW_PUBNUB_OPEN:-0}
      PUBNUB_SUBSCRIBE_KEY: ${PUBNUB_SUBSCRIBE_KEY:-}
      PUBNUB_PROBE_PUBLISH_KEY: ${PUBNUB_PROBE_PUBLISH_KEY:-}
      PUBNUB_SECRET_KEY: ${PUBNUB_SECRET_KEY:-}
      PUBNUB_READ_TOKEN: ${PUBNUB_READ_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      UNISTOW_DEVICE_KEY: ${UNISTOW_DEVICE_KEY:?Set UNISTOW_DEVICE_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks: [ web, database ]
    healthcheck:
      test: [ "CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [ web ]

networks:
  web:
  database:
    internal: true

volumes:
  postgres_data:
