name: unistow

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto/locker.acl:/mosquitto/config/locker.acl:ro
      - /etc/unistow/mqtt:/mosquitto/secrets:ro
    networks:
      mqtt:
        aliases: [ unistow.app ]

  db:
    image: postgres:16
    restart: unless-stopped
    command: [ "postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/run/postgres-tls/server.crt",
               "-c", "ssl_key_file=/run/postgres-tls/server.key", "-c", "hba_file=/etc/postgresql/tls-hba.conf" ]
    environment:
      POSTGRES_DB: unistow
      POSTGRES_USER: unistow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - /etc/unistow/postgres-tls/server.key:/run/postgres-tls/server.key:ro
      - /etc/unistow/postgres-tls/server.crt:/run/postgres-tls/server.crt:ro
      - ./deploy/local-postgres/pg_hba.conf:/etc/postgresql/tls-hba.conf:ro
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001_add_lockers.sql:/docker-entrypoint-initdb.d/02-lockers.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U unistow -d unistow" ]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [ database ]

  app:
    build: .
    command: [ ".venv/bin/uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000",
               "--proxy-headers", "--forwarded-allow-ips", "*",
               "--ssl-keyfile", "/run/app-tls/server.key", "--ssl-certfile", "/run/app-tls/server.crt" ]
    restart: unless-stopped
    environment:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /run/postgres-tls/server.crt
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: unistow
      POSTGRES_USER: unistow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_BASE_URL: https://unistow.app
      MQTT_HOST: unistow.app
      MQTT_APP_PASSWORD: ${MQTT_APP_PASSWORD:?Set MQTT_APP_PASSWORD}
      UNISTOW_MQTT_OPEN: ${UNISTOW_MQTT_OPEN:-1}
      UNISTOW_OPEN_TEST: ${UNISTOW_OPEN_TEST:-0}
      UNISTOW_OVERDUE_BILLING: ${UNISTOW_OVERDUE_BILLING:-0}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      UNISTOW_DEVICE_KEY: ${UNISTOW_DEVICE_KEY:?Set UNISTOW_DEVICE_KEY}
    volumes:
      - /etc/unistow/app-tls/server.crt:/run/app-tls/server.crt:ro
      - /etc/unistow/app-tls/server.key:/run/app-tls/server.key:ro
      - /etc/unistow/postgres-tls/server.crt:/run/postgres-tls/server.crt:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [ web, database, mqtt ]
    healthcheck:
      test: [ "CMD", ".venv/bin/python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8000/', context=ssl.create_default_context(cafile='/run/app-tls/server.crt'), timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/unistow/app-tls/server.crt:/run/app-tls/server.crt:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [ web ]

networks:
  mqtt:
  web:
  database:
    internal: true

volumes:
  postgres_data:
